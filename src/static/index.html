<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Activity card styling */
      .activity-card {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        margin: 12px 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        border: 1px solid rgba(0,0,0,0.05);
      }
      .activity-card h4 { margin: 0 0 8px; }
      .participants-section { margin-top: 12px; }
      .participants-section h5 {
        margin: 0 0 8px;
        font-size: 0.95rem;
        color: #333;
      }

      /* Participants list */
      .participants-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .participant-item {
        display: inline-flex;
        align-items: center;
        background: #f7fbff;
        border-radius: 20px;
        padding: 6px 10px;
        font-size: 0.9rem;
        color: #073b4c;
        box-shadow: inset 0 -1px 0 rgba(0,0,0,0.02);
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg,#7dd3fc,#38bdf8);
        color: #042a2b;
        font-weight: 600;
        margin-right: 8px;
        font-size: 0.8rem;
      }
      .participant-name { white-space: nowrap; }

      .no-participants {
        color: #6b7280;
        font-style: italic;
        margin: 4px 0 0;
      }

      /* Ensure activities list looks tidy on small screens */
      @media (max-width: 480px) {
        .participant-item { padding: 6px 8px; }
        .participant-name { font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
